name: OpenCode Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      startsWith(github.event.comment.body, '/oc ') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout agent branch
        uses: actions/checkout@v6
        with:
          ref: agent/work
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "phaladamou"
          git config --global user.email "phaladrien@gmail.com"

      - name: Run OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          TASK="${{ github.event.comment.body }}"
          TASK="${TASK#/oc }"
          npx -y opencode-ai run "$TASK"

      - name: Push changes
        run: |
          git push origin agent/work
