name: OpenCode Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      startsWith(github.event.comment.body, '/oc ') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout agent branch
        uses: actions/checkout@v6
        with:
          ref: agent/work
          fetch-depth: 0
          persist-credentials: true

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Auth OpenCode
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"opencode":{"type":"api","key":"${{ secrets.OPENCODE_API_KEY }}"}}' > ~/.local/share/opencode/auth.json

      - name: List models
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: opencode models

      - name: Configure Git
        run: |
          git config --global user.name "phaladamou"
          git config --global user.email "phaladrien@gmail.com"

      - name: Run OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          TASK="${COMMENT_BODY#/oc }"
          opencode run --model "opencode/mimo-v2.6-flash-free" "$TASK"

      - name: Push changes
        run: |
          git push origin agent/work
