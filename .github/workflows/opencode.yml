name: OpenCode Agent

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "phaladamou"
          git config --global user.email "phaladrien@gmail.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true

      - name: Save Memory
        if: always()
        run: |
          git add memory/ AGENTS.md
          git diff --staged --quiet || git commit -m "chore(memory): update agent memory [skip ci]"
          git push || true
